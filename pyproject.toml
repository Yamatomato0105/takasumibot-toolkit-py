[project]
name = "takasumibot-toolkit"
version = "0.1.0b0"
description = "Async Python client toolkit for the TakasumiBOT API"
authors = [{ name = "Yamatomato0105" }]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
keywords = [
    "takasumibot",
    "takasumi",
    "toolkit",
    "tool",
    "api",
    "client",
    "sdk",
    "async",
    "httpx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.0",
    "datamodel-code-generator>=0.25",
    "tzdata>=2024.1; sys_platform == 'win32'",
]
gen = ["datamodel-code-generator>=0.25"]

[project.urls]
Homepage = "https://github.com/Yamatomato0105/takasumibot-toolkit-py"
Repository = "https://github.com/Yamatomato0105/takasumibot-toolkit-py"
Issues = "https://github.com/Yamatomato0105/takasumibot-toolkit-py/issues"
Documentation = "https://github.com/Yamatomato0105/takasumibot-toolkit-py/blob/main/README.md"
"API endpoint" = "https://api.takasumibot.com/"
"API Documentation" = "https://api.takasumibot.com/docs"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/takasumibot_toolkit"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "D"]
ignore = ["D203", "D213", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]
"scripts/**" = ["ANN", "D"]
"src/takasumibot_toolkit/models/generated/*" = ["D", "E501", "RUF001", "RUF022"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = "takasumibot_toolkit.models.generated.*"
disable_error_code = ["misc", "call-arg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = ["live: requires real network access"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["takasumibot_toolkit"]
omit = ["*/models/generated/*"]

[tool.coverage.report]
fail_under = 90
